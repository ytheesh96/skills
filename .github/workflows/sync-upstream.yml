name: Sync Matt Pocock upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: mattpocock/skills

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch upstream main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
      - name: Prepare a clean upstream-mirror branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          upstream="$(git rev-parse upstream/main)"
          echo "upstream_sha=$upstream" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -C "upstream-mirror/$upstream" "$base"
          # A normal merge is intentional: conflicts fail closed instead of
          # allowing upstream to overwrite Hermes flat adaptations or README.
          if ! git merge --no-commit --no-ff upstream/main; then
            git merge --abort || true
            echo "Upstream merge conflict; no adaptation was overwritten." >&2
            exit 1
          fi
          python3 scripts/sync-upstream-flat.py
          python3 scripts/validate-hermes-tap.py
          git commit -m "chore: sync Matt Pocock skills at $upstream"
          git push --force-with-lease origin "HEAD:refs/heads/upstream-mirror/$upstream"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create or refresh sync pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: upstream-mirror/${{ steps.sync.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          body="This PR advances the preserved nested upstream tree to \\`${{ steps.sync.outputs.upstream_sha }}\\`.\n\nThe manifest and validation workflow identify mapped skill drift. Hermes flat adaptations are not overwritten; conflicts fail closed for maintainer review. This PR does not auto-merge behavior changes."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore: sync Matt Pocock upstream ${{ steps.sync.outputs.upstream_sha }}" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "chore: sync Matt Pocock upstream ${{ steps.sync.outputs.upstream_sha }}" --body "$body"
          fi
